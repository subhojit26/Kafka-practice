server:
  port: 8080

spring:
  application:
    name: library-events-producer-v2
  # Default profile when none is provided. Override with:
  #   --spring.profiles.active=stage   (CLI)
  #   SPRING_PROFILES_ACTIVE=prod      (env var)
  profiles:
    default: dev
  kafka:
    # Common Kafka settings shared by all environments.
    # The topic name is the same across every profile.
    # Only bootstrap-servers is environment-specific (see application-<profile>.yml).
    template:
      default-topic: library-events
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        retry:
          backoff:
            ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true


